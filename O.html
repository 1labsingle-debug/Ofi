  <script>
    (() => {
      const form = document.getElementById('interest-form');
      const submitButton = document.getElementById('submit-button');
      const status = document.getElementById('form-status');
      let selectedProfile = 'comerciante';
      let initialized = false;

      function setStatus(message, type) {
        status.textContent = message;
        status.style.color = type === 'success' ? '#d5ff42' : type === 'error' ? '#ff914d' : '#a8b9aa';
      }

      document.querySelectorAll('[data-profile]').forEach((button) => {
        button.addEventListener('click', () => {
          selectedProfile = button.dataset.profile;
          document.querySelectorAll('[data-profile]').forEach((item) => {
            const active = item === button;
            item.classList.toggle('is-active', active);
            item.setAttribute('aria-pressed', String(active));
          });
          setStatus('', 'info');
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!initialized) {
          setStatus('O cadastro ainda está sendo preparado. Tente novamente em instantes.', 'error');
          return;
        }
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        submitButton.disabled = true;
        submitButton.style.opacity = '.65';
        setStatus('Enviando seu pré-cadastro...', 'info');

        const record = {
          form_type: selectedProfile,
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          vehicle: document.getElementById('vehicle').value.trim(),
          location: document.getElementById('location').value.trim(),
          notes: document.getElementById('notes').value.trim(),
          created_at: new Date().toISOString()
        };

        const result = await window.dataSdk.create(record);
        submitButton.disabled = false;
        submitButton.style.opacity = '1';

        if (result.isOk) {
          form.reset();
          setStatus('Pré-cadastro recebido. Em breve a rede Lablog entrará em contato.', 'success');
        } else {
          setStatus('Não foi possível enviar agora. Confira sua conexão e tente novamente.', 'error');
        }
      });

      const dataHandler = {
        onDataChanged() {
          // Formulário de interesse é intencionalmente somente para envio.
        }
      };

      window.dataSdk.init(dataHandler).then((result) => {
        if (result.isOk) {
          initialized = true;
        } else {
          setStatus('O cadastro está indisponível neste momento.', 'error');
        }
      });

      lucide.createIcons();
    })();
  </script>
